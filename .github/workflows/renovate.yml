name: Renovate
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5,7 * * *'

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Get token
        id: get_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          owner: ${{ github.repository_owner }}
          repositories: |
            .github
            cli
            docs
            go-billy
            go-git
            go-git-fixtures
            gcfg

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          configurationFile: default.json
          token: '${{ steps.get_token.outputs.token }}'
        env:
          LOG_LEVEL: debug
          RENOVATE_USERNAME: go-git-renovate[bot]
          RENOVATE_GIT_NAME: go-git-renovate[bot]
          RENOVATE_GIT_EMAIL: go-git-renovate[bot]@users.noreply.github.com
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REPOSITORIES: go-git/.github,go-git/cli,go-git/docs,go-git/go-billy,go-git/go-git,go-git/go-git-fixtures,go-git/gcfg
